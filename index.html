<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente IA Local</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1><span>&#9679;</span> Assistente IA Local</h1>
    <div class="header-actions">
      <button onclick="clearChat()" title="Nova conversa"
        style="background:none;border:1px solid var(--border);color:var(--text-secondary);padding:0.4rem 0.75rem;border-radius:6px;cursor:pointer;font-size:0.82rem;">
        Nova conversa
      </button>
    </div>
  </header>

  <div id="context-banner" class="context-banner">
    <span class="context-icon">&#128206;</span>
    <span id="context-info" class="context-info"></span>
    <button id="btn-remove-context" class="btn-remove-context" title="Remover contexto">&times;</button>
  </div>

  <div id="chat-messages">
    <div id="typing-indicator" class="typing-indicator">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <div class="upload-buttons">
        <label class="btn-upload" title="Enviar PDF">
          &#128196;
          <input type="file" id="pdf-upload" accept=".pdf">
        </label>
        <label class="btn-upload" title="Enviar Áudio">
          &#127911;
          <input type="file" id="audio-upload" accept=".mp3,.wav,.m4a,.ogg,.webm">
        </label>
        <label class="btn-upload" title="Enviar Vídeo">
          &#127916;
          <input type="file" id="video-upload" accept=".mp4,.avi,.mkv,.webm,.mov">
        </label>
      </div>
      <textarea id="user-input" rows="1" placeholder="Digite sua mensagem..."></textarea>
      <button id="btn-send" title="Enviar">&#10148;</button>
    </div>
  </div>

  <div id="processing-overlay" class="processing-overlay">
    <div class="processing-card">
      <div class="spinner"></div>
      <p id="processing-text">Processando...</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pdf-handler.js"></script>
  <script src="js/media-handler.js"></script>

</body>
</html>
